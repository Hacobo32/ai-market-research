<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Board — AI Market Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1220;
    --panel: #121B2E;
    --panel-line: #1F2C45;
    --amber: #FFB000;
    --teal: #35D0BA;
    --text: #E8ECF1;
    --muted: #8592A6;
    --dim: #56637A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(53,208,186,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255,176,0,0.05), transparent 40%);
  }

  header {
    border-bottom: 1px solid var(--panel-line);
    padding: 28px 32px 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .brand .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--amber);
    text-transform: uppercase;
  }

  .brand h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .brand h1 .flap {
    display: inline-block;
    animation: flap-in 0.5s ease-out backwards;
  }

  @keyframes flap-in {
    0% { transform: translateY(-6px) scaleY(0.4); opacity: 0; }
    100% { transform: translateY(0) scaleY(1); opacity: 1; }
  }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .status .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 6px;
    box-shadow: 0 0 8px var(--teal);
  }

  main {
    padding: 28px 32px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 520px;
  }

  .panel-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .panel-head .name {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }

  .panel-head .count {
    font-size: 12px;
    color: var(--ink);
    background: var(--amber);
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 700;
  }

  .panel-body {
    overflow-y: auto;
    padding: 4px 0;
  }

  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 3px; }

  .row {
    padding: 10px 16px;
    border-bottom: 1px solid var(--panel-line);
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .row:last-child { border-bottom: none; }

  .row:hover { background: rgba(53,208,186,0.06); }

  .row .title {
    font-size: 13.5px;
    line-height: 1.4;
    color: var(--text);
    display: block;
    margin-bottom: 4px;
  }

  .row .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .row .meta span.hot { color: var(--amber); }

  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="eyebrow">Attention Signal Board</div>
    <h1 id="topic-heading">
      <span class="flap" style="animation-delay:0.00s">L</span><span class="flap" style="animation-delay:0.03s">O</span><span class="flap" style="animation-delay:0.06s">A</span><span class="flap" style="animation-delay:0.09s">D</span><span class="flap" style="animation-delay:0.12s">I</span><span class="flap" style="animation-delay:0.15s">N</span><span class="flap" style="animation-delay:0.18s">G</span>
    </h1>
  </div>
  <div class="status">
    <div><span class="dot"></span><span id="last-updated">Checking data.json…</span></div>
    <div id="lookback-note"></div>
  </div>
</header>

<main id="board">
  <!-- Panels are injected by JS -->
</main>

<footer>
  Sources: Reddit · Hacker News · GitHub Search · GitHub Trending · YouTube · Polymarket · arXiv · X/Twitter
</footer>

<script>
  const SOURCE_LABELS = {
    reddit: "Reddit",
    hackernews: "Hacker News",
    github_repos: "GitHub Repos",
    github_trending: "GitHub Trending",
    youtube: "YouTube",
    polymarket: "Polymarket",
    arxiv: "arXiv",
    twitter: "X / Twitter",
  };

  function timeAgo(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const diffMs = Date.now() - d.getTime();
    const hrs = Math.floor(diffMs / 3600000);
    if (hrs < 1) return "just now";
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function rowFor(key, item) {
    let title = "", url = "#", metaParts = [];

    switch (key) {
      case "reddit":
        title = item.title;
        url = item.url;
        metaParts = [
          item.score != null ? `<span class="hot">▲ ${item.score}</span>` : null,
          item.comments != null ? `${item.comments} comments` : null,
          timeAgo(item.published),
        ];
        break;
      case "hackernews":
        title = item.title;
        url = item.url;
        metaParts = [
          item.points != null ? `<span class="hot">▲ ${item.points}</span>` : null,
          item.comments != null ? `${item.comments} comments` : null,
          timeAgo(item.published),
        ];
        break;
      case "github_repos":
      case "github_trending":
        title = item.name;
        url = item.url;
        metaParts = [
          item.language,
          item.stars != null ? `<span class="hot">★ ${item.stars}</span>` : null,
          item.stars_this_week ? `<span class="hot">${item.stars_this_week}</span>` : null,
        ];
        break;
      case "youtube":
        title = item.title;
        url = item.url;
        metaParts = [
          item.channel,
          item.view_count != null ? `${item.view_count.toLocaleString()} views` : null,
        ];
        break;
      case "polymarket":
        title = item.title;
        url = item.url;
        metaParts = [
          item.price ? `<span class="hot">${item.price}</span>` : null,
          item.volume ? `vol ${item.volume}` : null,
        ];
        break;
      case "arxiv":
        title = item.title;
        url = item.url;
        metaParts = [
          (item.authors || []).slice(0, 2).join(", "),
          timeAgo(item.published),
        ];
        break;
      case "twitter":
        title = item.text;
        url = item.url;
        metaParts = [
          item.author ? `@${item.author}` : null,
          item.likes != null ? `<span class="hot">♥ ${item.likes}</span>` : null,
        ];
        break;
    }

    const meta = metaParts.filter(Boolean).join(" · ");
    return `<a class="row" href="${url || '#'}" target="_blank" rel="noopener">
      <span class="title">${title || "(untitled)"}</span>
      <span class="meta">${meta}</span>
    </a>`;
  }

  function renderPanel(key, items) {
    const label = SOURCE_LABELS[key] || key;
    const body = items && items.length
      ? items.map(item => rowFor(key, item)).join("")
      : `<div class="empty-state">No results yet.<br>Waiting on the next scheduled scrape.</div>`;

    return `<div class="panel">
      <div class="panel-head">
        <span class="name">${label}</span>
        <span class="count">${items ? items.length : 0}</span>
      </div>
      <div class="panel-body">${body}</div>
    </div>`;
  }

  async function load() {
    const heading = document.getElementById("topic-heading");
    const updated = document.getElementById("last-updated");
    const lookback = document.getElementById("lookback-note");
    const board = document.getElementById("board");

    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      const data = await res.json();

      heading.textContent = (data.topic || "Topic") + " Signal Board";
      updated.textContent = data.generated_at
        ? "Updated " + timeAgo(data.generated_at) + " · " + new Date(data.generated_at).toLocaleString()
        : "No scrape has run yet";
      lookback.textContent = data.lookback_days ? `Looking back ${data.lookback_days} days` : "";

      const order = ["reddit", "hackernews", "github_trending", "github_repos", "youtube", "arxiv", "polymarket", "twitter"];
      board.innerHTML = order.map(key => renderPanel(key, (data.sources || {})[key])).join("");
    } catch (err) {
      heading.textContent = "Signal Board";
      updated.textContent = "Couldn't load data.json";
      board.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
        Couldn't load data.json. If you're viewing this file directly from disk,
        serve it over a local server instead (e.g. <code>python -m http.server</code>),
        since browsers block fetch() on file:// URLs. On GitHub Pages this works automatically.
      </div>`;
    }
  }

  load();
</script>

</body>
</html>
